spring:
  datasource:
    url: jdbc:mysql:///${MYSQL_DATABASE}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&enableIamAuth=false
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  key: ${JWT_SECRET_KEY}
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 604800

teacher:
  registration-code: ${TEACHER_REGISTRATION_CODE}

logging:
  level:
    org.hibernate.SQL: WARN
    inu.lecture.software_design: INFO
