  CLOUD_SQL_INSTANCE: "keepy-493212:asia-northeast3:software-design-db"
  MYSQL_DATABASE: "software_design"
  MYSQL_USERNAME: "software_design"
  MYSQL_PASSWORD: "<채우기>"
  # --- Kafka (Redpanda) ---
  KAFKA_BOOTSTRAP_SERVERS: "d89vg40hvfrjvm53u44g.any.us-east-1.mpx.prd.cloud.redpanda.com:9092"
  KAFKA_USERNAME: "dongkyun"
  KAFKA_PASSWORD: "<채우기>"
  # --- App ---
  OPENAI_API_KEY: "<채우기>"
