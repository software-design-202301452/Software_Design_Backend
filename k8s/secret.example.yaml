# =========================================================================
# 비밀값 템플릿 — 이 파일은 ArgoCD 동기화 대상이 아니다 (argocd-application.yaml 의
# directory.include 가 deployment/service 만 포함). 실제 값을 채운 사본을
# 로컬에서 kubectl 로 1회 적용한다. 실제 값이 담긴 파일은 절대 커밋하지 말 것.
#
#   cp secret.example.yaml secret.yaml   # secret.yaml 은 .gitignore 처리
#   <값 채우기>
#   kubectl apply -f secret.yaml
# =========================================================================
